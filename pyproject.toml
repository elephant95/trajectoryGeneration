[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-rail-rl"
version = "0.1.0"
description = "An RL agent discovers a near-optimal rail network connecting Swiss cities, rendered as an educational video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "shapely>=2.0",
  "pyproj>=3.5",
  "networkx>=3.1",
  "pydantic>=2.4",
  "PyYAML>=6.0",
  "gymnasium>=0.29",
  "stable-baselines3>=2.2",
  "sb3-contrib>=2.2",
  "cma>=3.3",
  "requests>=2.31",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "imageio[ffmpeg]>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
manim = ["manim>=0.18"]
dev = ["pytest>=7.4"]
# geoquiz: the automated geo-quiz video generator (independent of swiss_rail_rl's RL stack)
geoquiz = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.5",
  "pyogrio>=0.9",
  "pyarrow>=15",
  "osmium>=4.0",
  "skia-python>=138",
  "opencv-python-headless>=4.9",
  "scipy>=1.10",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.scripts]
swiss-rail-rl = "swiss_rail_rl.cli:main"
geoquiz = "geoquiz.cli:main"

[tool.setuptools.packages.find]
include = ["swiss_rail_rl*", "geoquiz*"]
